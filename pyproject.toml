[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stegacrypt"
version = "2.0.0"
description = "Encrypt a message with RSA+AES and hide it in a PNG image (LSB steganography)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "devilnevecry" }]
keywords = ["steganography", "encryption", "rsa", "aes-gcm", "png"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=42",
  "Pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/devilnevecry/stegacrypt"

[project.scripts]
stegacrypt = "stegacrypt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
